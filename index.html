<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stasia Elegant Fabrique</title>
    <meta name="description" content="Luxury fabrics, bespoke clothing, authentic wrappers, and fashion accessories catalog with staff inventory management." />
    <meta property="og:title" content="Stasia Elegant Fabrique" />
    <meta property="og:description" content="Luxury fabrics, bespoke clothing, authentic wrappers, and fashion accessories catalog with staff inventory management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link rel="icon" type="image/svg+xml" href="/stasia_logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('stasia_theme_preference') || 'system';
          const isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf8f5] text-stone-900 dark:bg-[#0c0c0e] dark:text-stone-100 font-sans antialiased selection:bg-amber-200 dark:selection:bg-amber-900/60 selection:text-amber-950 dark:selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
